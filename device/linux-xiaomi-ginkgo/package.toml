[package]
name = "linux-xiaomi-ginkgo"
version = "7.2.rc2.r0"
description = "Mainline kernel for Xiaomi Redmi Note 8 (ginkgo / sm6125)"

[build]
source = "https://github.com/PeacockProject/linux_sm6125_ginkgo/archive/db3f159aa32c11688ee4873a6218ea113052fee6.tar.gz"
checksum = "c62a7bd5701513c414eda3fb504f854433fc52c5a2aec30d500a06177e4deeba"
build_deps = ["base-devel", "bc", "dtc", "kmod", "cpio", "python", "perl", "openssl"]
use_qemu = false
# Cross toolchain + CROSS_COMPILE resolve from target_arch + the c-toolchain
# capability via toolchains.toml — no hardcoded cross packages or prefix.
target_arch = "aarch64"
capabilities = ["c-toolchain"]

script = """
set -e

# Full-featured kernel for the INSTALLED system (modules kept). The recovery
# variant is linux-xiaomi-ginkgo-prp, which trims this same tree to built-ins.
echo "Generating base arm64 defconfig..."
yes "" | make ARCH=${ARCH:-arm64} defconfig

echo "Disabling pointer-auth flags that break with current GCC..."
if [ -x ./scripts/config ]; then
  ./scripts/config --disable ARM64_PTR_AUTH || true
  ./scripts/config --disable ARM64_PTR_AUTH_KERNEL || true
  ./scripts/config --disable BUILTIN_RETURN_ADDRESS_STRIPS_PAC || true
fi

# The arm64 defconfig is SoC-agnostic; these are the ginkgo-specific drivers.
# Built in rather than modular so the display and the boot device come up
# without an initramfs having to find them first.
if [ -x ./scripts/config ]; then
  cat >/tmp/ginkgo-force-y.list <<'EOF'
DRM
DRM_MSM
DRM_MSM_DSI
DRM_PANEL_NOVATEK_NT36672A
DRM_SIMPLEDRM
DRM_FBDEV_EMULATION
FB
BACKLIGHT_CLASS_DEVICE
MMC
MMC_BLOCK
MMC_SDHCI
MMC_SDHCI_PLTFM
MMC_SDHCI_MSM
EXT4_FS
SM_GCC_6125
SM_DISPCC_6125
INTERCONNECT_QCOM_SM6125
DEVTMPFS
DEVTMPFS_MOUNT
EFI_PARTITION
MSDOS_PARTITION
INPUT_EVDEV
INPUT_PM8941_PWRKEY
SPI_QCOM_GENI
TOUCHSCREEN_NT36672A
REGULATOR_QCOM_SPMI
REGULATOR_QCOM_LCDB
QCOM_SPMI_ADC5
PHY_QCOM_QUSB2
USB_DWC3
USB_DWC3_QCOM
USB_ROLE_SWITCH
TYPEC
TYPEC_TCPM
TYPEC_QCOM_PMIC
QCOM_MDT_LOADER
QCOM_PDR_HELPERS
QCOM_QMI_HELPERS
EOF
  while IFS= read -r sym; do
    [ -n "$sym" ] || continue
    ./scripts/config --enable "$sym" || true
  done < /tmp/ginkgo-force-y.list

  # Remote processors and Wi-Fi stay modular: they need firmware from
  # firmware-xiaomi-ginkgo and are better loaded once userspace is up.
  for sym in QCOM_Q6V5_PAS ATH10K ATH10K_SNOC; do
    ./scripts/config --module "$sym" || true
  done
fi

yes "" | make ARCH=${ARCH:-arm64} olddefconfig

MAKE_ARGS="ARCH=${ARCH:-arm64}"
if [ -n "${CROSS_COMPILE:-}" ]; then
  MAKE_ARGS="$MAKE_ARGS CROSS_COMPILE=${CROSS_COMPILE}"
fi

JOBS="${PEACOCK_JOBS:-4}"
if [ -z "$JOBS" ] || [ "$JOBS" -lt 1 ]; then
  JOBS=1
fi

DTB_OUT="arch/arm64/boot/dts/qcom/sm6125-xiaomi-ginkgo.dtb"
if [ ! -f "arch/arm64/boot/dts/qcom/sm6125-xiaomi-ginkgo.dts" ]; then
  echo "Error: ginkgo DTB source not found"
  exit 1
fi

echo "Compiling kernel Image.gz + ginkgo DTB..."
make $MAKE_ARGS -j"$JOBS" Image.gz qcom/sm6125-xiaomi-ginkgo.dtb

echo "Compiling modules..."
make $MAKE_ARGS -j"$JOBS" modules

rm -rf stage
mkdir -p stage/boot/dtbs/qcom
make $MAKE_ARGS modules_install INSTALL_MOD_PATH="$(pwd)/stage"

cp "$DTB_OUT" stage/boot/dtbs/qcom/

# Appended DTB: SM6125 has no lk2nd port and the stock ABL does not patch a
# separately-passed DTB, so the boot image carries kernel+DTB as one blob.
cat arch/arm64/boot/Image.gz "$DTB_OUT" > zImage
cp zImage stage/zImage
cp .config stage/boot/config

if [ -d "stage/lib/modules" ]; then
  tar -czf modules.tar.gz -C stage lib/modules
  cp modules.tar.gz stage/modules.tar.gz
fi
"""
