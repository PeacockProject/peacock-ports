[device]
name = "Xiaomi Redmi Note 8"
architecture = "aarch64"
soc = "sm6125"
status = "testing"
flash_method = "fastboot-bootimg"

# Support matrix surfaced by the peacock-builder GUI. Values: ok | partial | none.
#
# Sourced from the ginkgo tree's own "flesh out the board" commit, which
# enumerates what it brought up, and from the DTS comments. Anything the tree
# does not claim is recorded as none rather than guessed — revise from real
# on-device testing, not from this file's optimism.
[support]
touch = "ok"
gpu = "ok"
wifi = "ok"
bluetooth = "ok"
calls = "none"
calls_note = "Modem authenticates and runs QMI, but no call audio path is wired up yet."
sms = "none"
modem = "partial"
modem_note = "MPSS boots, authenticates and serves QMI with rmtfs; auto_boot is off and it is not required for Wi-Fi."
camrear = "none"
camrear_note = "Sensor drivers exist in-tree; no capture pipeline validated."
camfront = "none"
gps = "none"
sensors = "none"
sensors_note = "Deliberately absent: the sensors hang off serial engines owned by the sensor DSP, not the application processor."
battery = "ok"
battery_note = "PMI632 charger + generic-adc-battery."
audio = "partial"
audio_note = "WCD937x and MAX98937 path described; playback not verified end to end."

[boot]
cmdline = "console=ttyMSM0,115200n8 loglevel=4"
generate_bootimg = true

# Geometry from the ginkgo recovery device trees. Note the 4096 page size and
# the zero base — SM6125's ABL applies its own load addresses.
[boot.android]
base = "0x00000000"
page_size = 4096
kernel_offset = "0x00008000"
ramdisk_offset = "0x01000000"
second_offset = "0x00f00000"
tags_offset = "0x00000100"

[quirks]
keep_fb_refresher_with_dm = false
xorg_force_vt1 = true
use_fb_refresher = false
legacy_rootfs_ext4 = false
