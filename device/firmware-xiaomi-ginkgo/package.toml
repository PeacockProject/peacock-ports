# firmware-xiaomi-ginkgo — vendor firmware for the Redmi Note 8.
#
# Ships the blobs, mirrored on genmirror. They are Qualcomm's, Xiaomi's and
# Novatek's; no licence grants redistribution, and this follows the same
# practice as firmware-xiaomi-daisy. The blob tarball is hosted on genmirror
# rather than GitHub deliberately — the public repo
# (PeacockProject/ginkgo-firmware) stays blob-free and carries only the
# extraction script, manifest and hardware notes.
#
# The extractor is installed alongside the blobs at
# /usr/share/peacock/firmware/ginkgo/. It matters because some of this firmware
# is ROM-specific: the a610 zap shader's .mdt and b01 are signature segments, so
# a re-signed vendor image changes them and the GPU will refuse to leave secure
# mode with the wrong copy. On a different ROM, re-extract from your own device.

[package]
name = "firmware-xiaomi-ginkgo"
version = "20260804"
description = "Firmware blobs for Xiaomi Redmi Note 8 (ginkgo / SM6125): modem, ADSP, Venus, Adreno 610 zap, QUP, ath10k board data, QCA Bluetooth, Novatek touch"

[install]
layout = "system"

[build]
type = "raw"
source = "https://genmirror.peacockos.org/firmware/stable/aarch64/ginkgo-firmware.tar.gz"
checksum = "2dec2ce05ad0a2897c65a18a033e01bc1d5fbb1dec062f2f65efd15b6e971afa"
build_deps = ["coreutils"]
